[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-video-studio"
version = "0.0.1"
description = "Local-first AI video production studio: orchestration core for ComfyUI, LTX and media tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
# NOTE: torch is deliberately NOT a dependency (ADR-0005). All GPU work runs in separate engine environments.
# Ranges are provisional until the environment is authorized (A2); no lockfile is committed at M0.1.
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "nvidia-ml-py>=12,<14",
  "psutil>=5.9,<8",
  "av>=12,<16",
  "pillow>=10.3,<12",
  "numpy>=1.26,<3",
  "jinja2>=3.1,<4",
  "ruamel.yaml>=0.18,<0.19",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "hypothesis>=6.100,<7",
  "ruff>=0.5,<1",
  "pyright>=1.1.370,<2",
]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
interchange = ["OpenTimelineIO>=0.16,<0.18"]

# [project.scripts]
# studio = "studio.cli.main:app"   # enabled in M0.4 when the CLI source exists

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "gpu: needs the GPU (opt-in, requires A6)",
  "comfyui: needs a running ComfyUI (opt-in)",
  "ltx: needs the LTX runtime (opt-in, requires A6)",
]
addopts = "-m 'not gpu and not comfyui and not ltx'"
